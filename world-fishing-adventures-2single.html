<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>World Fishing Adventures</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1530;font-family:system-ui,"Segoe UI",Roboto,sans-serif;color:#fff;user-select:none}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:6px;padding:6px;flex-wrap:wrap;pointer-events:none}
#stat,#nav{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto}
.chip{background:#0b1a3acc;border:1px solid #fff3;border-radius:10px;padding:6px 10px;font-weight:600;font-size:14px}
button{font:inherit;color:#fff;background:linear-gradient(#2f86e8,#1b57b0);border:0;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700}
button:hover{filter:brightness(1.15)}button:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.nb{background:#0b1a3acc;border:1px solid #fff3;padding:6px 10px;font-size:14px}
.gold{background:linear-gradient(#ffc83d,#d98a00);color:#2a1a00}.red{background:linear-gradient(#e85454,#a52323)}.grn{background:linear-gradient(#3cc46a,#1b8a45)}
#hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#0b1a3acc;padding:6px 14px;border-radius:20px;font-size:14px;font-weight:600;max-width:60vw;text-align:center}
#fishBtn{position:fixed;right:16px;bottom:16px;width:104px;height:104px;border-radius:50%;font-size:19px;line-height:1.1;background:radial-gradient(#ff9a4d,#d8431a);box-shadow:0 6px 0 #8a2a10,0 8px 20px #0008;touch-action:none}
#fishBtn.on,#fishBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #8a2a10}
#ov,#md{position:fixed;inset:0;pointer-events:none}
#ov:not(:empty),#md:not(:empty){pointer-events:auto;background:#050c22b0;display:flex;align-items:center;justify-content:center;padding:8px}
#md{z-index:5}
.panel{background:linear-gradient(#17325f,#0e1f40);border:2px solid #5b8fd8;border-radius:16px;width:min(980px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 10px 40px #000a}
.ph{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid #fff2}.ph h2{margin:0;font-size:22px}
.pb{padding:14px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{background:#0a1730;border:2px solid #2f4f86;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.card.lock{opacity:.5}.card.cur{border-color:#ffc83d}.card h4{margin:0;font-size:16px}.sm{font-size:12px;opacity:.8}
.bar{height:7px;background:#fff2;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:#4aa3ff}
.row{display:flex;align-items:center;gap:10px;padding:6px;border-bottom:1px solid #fff1}.row img{width:60px;height:30px}.row .g{flex:1}
.book .card{cursor:pointer;align-items:center;text-align:center}.book img{width:110px;height:55px}
.modal{background:linear-gradient(#1c3a6e,#0e1f40);border:3px solid var(--c,#5b8fd8);box-shadow:0 0 40px var(--c,#5b8fd8);border-radius:18px;padding:18px;text-align:center;width:min(420px,100%);max-height:100%;overflow:auto;animation:pop .35s}
.modal img{width:220px;height:110px;filter:drop-shadow(0 0 12px var(--c))}.modal h2{margin:6px 0}.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-weight:800;color:#000}
.legend{animation:pop .35s,glow 1s infinite alternate}
@keyframes pop{from{transform:scale(.6);opacity:0}}@keyframes glow{to{box-shadow:0 0 90px var(--c)}}
#toasts{position:fixed;top:58px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:9}
.toast{background:#0b1a3af0;border:2px solid #5b8fd8;padding:8px 16px;border-radius:12px;font-weight:700;animation:pop .25s}.toast.bad{border-color:#e85454}.toast.good{border-color:#ffc83d}
.title{text-align:center;padding:20px}.title h1{font-size:clamp(30px,7vw,60px);margin:0 0 6px;color:#ffd04d;text-shadow:0 4px 0 #a35a00}.title button{display:block;margin:10px auto;width:240px;font-size:18px}
input[type=range],select,textarea{width:100%;font:inherit}textarea{height:80px;background:#0a1730;color:#fff;border:1px solid #5b8fd8;border-radius:8px}
@media(max-width:700px){#fishBtn{width:120px;height:120px}.chip,.nb{font-size:12px;padding:5px 7px}}

function buildFish(){
 FISH=[];FISH_BY_ID={};
 for(const o of FISH_RAW){
  const li=LOCS.findIndex(l=>l.id===o.l),R=RARITIES[o.r];
  if(li<0||!R||!o.w){console.warn('Fish skipped (bad location/rarity):',o.n);continue}
  const avg=(o.w[0]+o.w[1])/2,h=hash(o.n+o.l),d=Math.min(10,R.d+Math.min(1.5,Math.log10(o.w[1]+1)*.6));
  const loc=LOCS[li],cond=(o.t?(o.t==='night'?' Bites after dark.':' Bites by day.'):'')+(o.wx?` Appears in ${o.wx} weather.`:'')+(o.se?` Seen in ${o.se}.`:'');
  const f=Object.assign({id:o.n.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'_'+o.l,d,s:Math.min(10,1+d*.7+(h%10)*.15),v:Math.round(R.base*(1+Math.sqrt(avg)/5)*(1+li*.1)),pref:['worm','minnow','golden'][h%3],dp:0,desc:`A ${o.r} catch of ${loc.n}.${cond}`},o);
  if(FISH_BY_ID[f.id])continue;FISH.push(f);FISH_BY_ID[f.id]=f}
}
