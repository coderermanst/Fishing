const FISH=[

 {name:'Largemouth Bass',loc:'everglades',rarity:'uncommon',weight:[1,6],difficulty:2,temp:[10,40],weather:'rain',design:'#89a849',shape:'slim'},

 {name:'Muskellunge',loc:'greatlakes',rarity:'epic',weight:[6,30],difficulty:4,temp:[-5,30],season:'autumn',design:'#3d8d69',shape:'long'},
 {name:'Red-Bellied Piranha',loc:'amazon',rarity:'common',weight:[.3,1.5],difficulty:1,temp:[5,45],design:'#cf6a55',shape:'round'},
 {name:'Tambaqui',loc:'amazon',rarity:'uncommon',weight:[5,30],difficulty:2,temp:[15,45],weather:'rain',design:'#c58a42',shape:'round'},
 {name:'Arapaima',loc:'amazon',rarity:'epic',weight:[50,200],difficulty:5,temp:[15,45],season:'summer',design:'#df7259',shape:'long'},
 {name:'Yellowtail Snapper',loc:'caribbean',rarity:'common',weight:[.5,4],difficulty:1,temp:[10,45],design:'#ebd347',shape:'slim'},
 {name:'Mahi-Mahi',loc:'caribbean',rarity:'uncommon',weight:[4,20],difficulty:2,temp:[15,45],season:'summer',design:'#32c79a',shape:'round'},
 {name:'Blue Marlin',loc:'caribbean',rarity:'legendary',weight:[100,450],difficulty:5,temp:[15,45],design:'#4d8fea',shape:'long'},
 {name:'Sardine',loc:'mediterranean',rarity:'common',weight:[.05,.2],difficulty:1,temp:[-5,40],design:'#a9c5d7',shape:'slim'},
 {name:'Gilt-head Bream',loc:'mediterranean',rarity:'uncommon',weight:[1,6],difficulty:2,temp:[0,40],design:'#d6a86a',shape:'round'},
 {name:'Bluefin Tuna',loc:'mediterranean',rarity:'epic',weight:[100,400],difficulty:4,temp:[5,40],season:'summer',design:'#416994',shape:'long'},
 {name:'Atlantic Cod',loc:'fjords',rarity:'common',weight:[2,15],difficulty:1,temp:[-25,28],design:'#a7a76c',shape:'round'},
 {name:'Arctic Char',loc:'fjords',rarity:'uncommon',weight:[1,9],difficulty:2,temp:[-25,22],season:'winter',design:'#d87964',shape:'slim'},
 {name:'Kraken Pup Anglerfish',loc:'fjords',rarity:'legendary',weight:[5,30],difficulty:5,temp:[-20,20],weather:'snow',design:'#a66ce0',shape:'spiky'},
 {name:'Nile Tilapia',loc:'nile',rarity:'common',weight:[.3,3],difficulty:1,temp:[5,48],design:'#bca777',shape:'round'},
 {name:'Tigerfish',loc:'nile',rarity:'uncommon',weight:[2,15],difficulty:2,temp:[10,48],weather:'rain',design:'#e67b3f',shape:'slim'},
 {name:'Nile Perch',loc:'nile',rarity:'epic',weight:[20,150],difficulty:4,temp:[15,48],season:'summer',design:'#4c97b5',shape:'round'},
 {name:'Horse Mackerel',loc:'japan',rarity:'common',weight:[.1,.7],difficulty:1,temp:[-5,38],design:'#a8c6cc',shape:'slim'},
 {name:'Tai Red Seabream',loc:'japan',rarity:'uncommon',weight:[1,9],difficulty:2,temp:[0,38],design:'#e57b77',shape:'round'},

 {name:'Clownfish',loc:'reef',rarity:'common',weight:[.05,.2],difficulty:1,temp:[10,45],design:'#ff914d',shape:'round'},
 {name:'Coral Trout',loc:'reef',rarity:'uncommon',weight:[2,12],difficulty:2,temp:[10,45],weather:'clear',design:'#d95c62',shape:'slim'},
 {name:'Rainbow Dreamfish',loc:'reef',rarity:'epic',weight:[.5,3],difficulty:4,temp:[15,45],season:'spring',design:'#be73eb',shape:'spiky'},
 {name:'Icefish',loc:'antarctic',rarity:'common',weight:[.2,1],difficulty:1,temp:[-30,15],design:'#c4e6ed',shape:'slim'},
 {name:'Antarctic Toothfish',loc:'antarctic',rarity:'uncommon',weight:[20,120],difficulty:2,temp:[-30,12],design:'#869bad',shape:'round'},

 {name:'Pacu',loc:'amazondelta',rarity:'common',weight:[1,8],difficulty:1,temp:[10,45],design:'#c27b58',shape:'round'},
 {name:'King Salmon',loc:'alaska',rarity:'rare',weight:[8,45],difficulty:3,temp:[-20,25],season:'summer',design:'#e68b78',shape:'slim'},
 {name:'Northern Pike',loc:'alaska',rarity:'uncommon',weight:[2,25],difficulty:2,temp:[-25,25],design:'#87a755',shape:'long'},
 {name:'Hawaiian Wahoo',loc:'hawaii',rarity:'rare',weight:[10,80],difficulty:3,temp:[10,45],design:'#47b6d2',shape:'long'},
 {name:'Humu Triggerfish',loc:'hawaii',rarity:'common',weight:[.2,2],difficulty:1,temp:[10,45],design:'#e4ae43',shape:'spiky'},
 {name:'Mekong Giant Catfish',loc:'mekong',rarity:'legendary',weight:[80,350],difficulty:5,temp:[10,48],design:'#a6a6a0',shape:'round'},
 {name:'Snakehead',loc:'mekong',rarity:'uncommon',weight:[1,12],difficulty:2,temp:[10,48],design:'#668a52',shape:'long'},
 {name:'Cape Snoek',loc:'cape',rarity:'common',weight:[2,8],difficulty:1,temp:[0,38],design:'#95b9a2',shape:'slim'},
 {name:'Bluefin Tuna',loc:'cape',rarity:'epic',weight:[80,300],difficulty:4,temp:[5,35],design:'#416994',shape:'long'}
];
const RARITY={common:'#c5d0da',uncommon:'#5cc46a',rare:'#4aa3ff',epic:'#b05cff',legendary:'#ffb020'};
const RODS=[{id:'starter',name:'Starter Rod',cost:0,help:0},{id:'willow',name:'Willow Rod',cost:130,help:1},{id:'fiberglass',name:'Fibreglass Rod',cost:300,help:2},{id:'carbon',name:'Carbon Rod',cost:700,help:3},{id:'deepsea',name:'Deep-Sea Rod',cost:1500,help:4},{id:'starlight',name:'Starlight Rod',cost:3000,help:5}];
const REELS=[{id:'basic',name:'Basic Reel',cost:0,help:0},{id:'smooth',name:'Smooth Reel',cost:120,help:1},{id:'precision',name:'Precision Reel',cost:400,help:2},{id:'proreel',name:'Pro Reel',cost:900,help:3},{id:'tide',name:'Tide Turner',cost:1800,help:4},{id:'goldreel',name:'Golden Reel',cost:3200,help:5}];
const LURES=[{id:'plain',name:'Plain Hook',cost:0,bonus:0,desc:'No rarity bonus; reliable starter lure.'},{id:'worm',name:'Wiggly Worm',cost:100,bonus:.08,desc:'A little more likely to attract uncommon fish.'},{id:'shiny',name:'Shiny Spinner',cost:350,bonus:.18,desc:'Improves the odds of rare and epic fish.'},{id:'glow',name:'Glow Minnow',cost:800,bonus:.3,desc:'A bright lure with a strong rare-fish bonus.'},{id:'legend',name:'Legend Lure',cost:1800,bonus:.45,desc:'Best chance to attract legendary fish.'},{id:'rainbow',name:'Rainbow Spoon',cost:1200,bonus:.35,desc:'A colorful lure favored by unusual catches.'}];
const SEASONS=['spring','summer','autumn','winter'];
const $=id=>document.getElementById(id),canvas=$('c'),ctx=canvas.getContext('2d');
const saved=(()=>{try{return JSON.parse(localStorage.getItem('wfa_easy_v2'))||{}}catch{return{}}})();
const S=Object.assign({coins:60,loc:'everglades',season:'spring',rod:'starter',reel:'basic',lure:'plain',ownedRods:['starter'],ownedReels:['basic'],ownedLures:['plain'],total:0,inventory:[],book:{}},saved);
if(!LOCATIONS.some(x=>x.id===S.loc))S.loc='everglades';if(!SEASONS.includes(S.season)&&S.season!=='auto')S.season='spring';
if(!Array.isArray(S.ownedRods))S.ownedRods=['starter'];if(!Array.isArray(S.ownedReels))S.ownedReels=['basic'];if(!Array.isArray(S.ownedLures))S.ownedLures=['plain'];if(!Array.isArray(S.inventory))S.inventory=[];if(!S.book||typeof S.book!=='object')S.book={};
if(!RODS.some(x=>x.id===S.rod)||!S.ownedRods.includes(S.rod))S.rod='starter';if(!REELS.some(x=>x.id===S.reel)||!S.ownedReels.includes(S.reel))S.reel='basic';if(!LURES.some(x=>x.id===S.lure)||!S.ownedLures.includes(S.lure))S.lure='plain';
let state='idle',clock=0,castT=0,biteAt=0,fish=null,fishWeight=0,marker=0,markerDir=1,hits=0,misses=0,needed=1,weather='clear',toastTimer=0,rainCycle=0;
const loc=()=>LOCATIONS.find(x=>x.id===S.loc)||LOCATIONS[0],gear=()=>({rod:RODS.find(x=>x.id===S.rod)||RODS[0],reel:REELS.find(x=>x.id===S.reel)||REELS[0]}),lure=()=>LURES.find(x=>x.id===S.lure)||LURES[0];
function save(){try{localStorage.setItem('wfa_easy_v2',JSON.stringify(S))}catch{}}
function notify(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',2600)}
function environment(){const season=S.season==='auto'?SEASONS[Math.floor((clock/90)%4)]:S.season;const shift={spring:0,summer:8,autumn:-2,winter:-10}[season];return{season,temp:loc().temp+shift+(weather==='rain'?-2:weather==='snow'?-5:0),weather}}
function eligibleFish(){const e=environment();return FISH.filter(f=>f.loc===S.loc&&(!f.season||f.season===e.season)&&(!f.weather||f.weather===e.weather)&&(!f.temp||(e.temp>=f.temp[0]&&e.temp<=f.temp[1])))}
function chooseFish(){const pool=eligibleFish();if(!pool.length)return null;const bonus=lure().bonus;const weighted=pool.map(f=>{let w=({common:60,uncommon:25,rare:9,epic:3,legendary:1}[f.rarity]||1);if(f.rarity!=='common')w*=1+bonus*(f.rarity==='uncommon'?1:f.rarity==='rare'?2:f.rarity==='epic'?2.8:3.5);else w*=Math.max(.35,1-bonus*.7);return{f,w}});let r=Math.random()*weighted.reduce((a,x)=>a+x.w,0);for(const x of weighted){r-=x.w;if(r<=0)return x.f}return weighted.at(-1).f}
function weatherRoll(){const phase=clock%300;rainCycle=phase;if(phase<35){weather='rain';return}const options=loc().weather.filter(x=>x!=='rain');weather=options[Math.floor(Math.random()*options.length)]||'clear'}
function cast(){if(state!=='idle')return;weatherRoll();fish=chooseFish();if(!fish){const e=environment();notify(`No fish are biting here in ${e.season} at ${e.temp.toFixed(0)}°C (${weather}). Try another season or place.`);hud();return}fishWeight=fish.weight[0]+Math.random()*(fish.weight[1]-fish.weight[0]);state='cast';castT=0;hud();notify('Cast out! A fish will bite in 1–3 seconds.')}
function bite(){state='fight';hits=0;misses=0;marker=Math.random()*.8+.1;markerDir=Math.random()<.5?1:-1;const g=gear();needed=Math.max(1,fish.difficulty-Math.floor((g.rod.help+g.reel.help)/2));hud();notify(`A ${fish.name} is hooked! Press SPACE when the moving line is inside the green box.`)}
function press(){if(state==='idle'){cast();return}if(state!=='fight')return;const g=gear(),width=Math.min(.52,.18+g.rod.help*.045+g.reel.help*.05);if(marker>=.5-width/2&&marker<=.5+width/2){hits++;if(hits>=needed)catchFish();else notify(`Nice! ${needed-hits} more hit${needed-hits===1?'':'s'} to reel it in.`)}else{misses++;if(misses>=5){state='idle';fish=null;hud();notify('The fish slipped away. Cast again when you are ready.')}else notify(`Missed the green box! ${5-misses} tries left.`)}}
function catchFish(){const value=Math.max(2,Math.round(fishWeight*({common:3,uncommon:6,rare:12,epic:24,legendary:50}[fish.rarity]||3)));const caught={name:fish.name,weight:fishWeight,value,rarity:fish.rarity,loc:S.loc,design:fish.design,shape:fish.shape,date:new Date().toLocaleDateString()};S.total++;S.inventory.push(caught);const old=S.book[fish.name]||{count:0,bestWeight:0,fish:{...fish}};old.count++;if(fishWeight>old.bestWeight){old.bestWeight=fishWeight;old.fish={...fish};old.bestValue=value}S.book[fish.name]=old;const name=fish.name;state='idle';fish=null;save();hud();notify(`Caught ${name} · ${fishWeight.toFixed(1)} kg! Added to your lifetime fish book.`)}
function hud(){const e=environment(),phase=clock%300,until=phase<35?35-phase:300-phase;$('stats').innerHTML=`<span class="chip">🪙 ${S.coins}</span><span class="chip">📍 ${loc().name}</span><span class="chip">${e.season} · ${e.temp.toFixed(0)}°C · ${weatherIcon()}</span><span class="chip">🌧️ Rain ${phase<35?'now':`in ${Math.ceil(until)}s`}</span><span class="chip">🐟 ${S.total} caught</span>`;$('nav').innerHTML='<button class="navbtn" data-page="map">🗺️ Places</button><button class="navbtn" data-page="rods">🎣 Rods</button><button class="navbtn" data-page="reels">⚙️ Reels</button><button class="navbtn" data-page="lures">🪝 Lures</button><button class="navbtn" data-page="bag">🧺 Sell fish</button><button class="navbtn" data-page="book">📖 Fish book</button><button class="navbtn" data-page="settings">☀️ Season</button>'}
function weatherIcon(){return{clear:'☀️',cloudy:'☁️',rain:'🌧️',snow:'❄️'}[weather]||'☀️'}
function fishSvg(f){const color=f?.design||'#9db8c8',shape=f?.shape||'slim';let body=shape==='long'?'M28 52 Q53 25 113 45 Q131 52 113 62 Q54 80 28 52Z':shape==='round'?'M30 52 Q42 23 78 28 Q112 30 120 52 Q110 76 77 76 Q43 77 30 52Z':'M29 52 Q48 31 100 39 Q116 42 122 52 Q110 65 100 66 Q48 73 29 52Z';let tail=shape==='spiky'?'M31 52 L9 34 L14 52 L9 70Z':'M30 52 L9 35 L14 52 L9 69Z';const stripe=shape==='spiky'?'<path d="M56 31l-9-13 18 10m17 1 4-15 9 15" fill="none" stroke="#fff8" stroke-width="4"/>':'<path d="M66 36q-9 16 0 31m17-29q-9 14 0 27" fill="none" stroke="#fff7" stroke-width="4"/>';return `<svg class="fish-art" viewBox="0 0 140 104" role="img" aria-label="Illustration of ${f?.name||'fish'}"><defs><linearGradient id="water" x2="0" y2="1"><stop stop-color="#9be7ef"/><stop offset="1" stop-color="#287d9e"/></linearGradient><linearGradient id="body" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity=".2"/></linearGradient></defs><rect width="140" height="104" rx="12" fill="url(#water)"/><path d="M0 78q25-9 48 0t46 0 46 0v26H0Z" fill="#d5fbff" opacity=".15"/><path d="${tail}" fill="${color}"/><path d="${body}" fill="${color}" stroke="#ffffffaa" stroke-width="2"/><path d="M43 40q15-24 34-10l-7 12Z" fill="${color}" opacity=".85"/><path d="M78 64q14 19 25 5l-12-9Z" fill="${color}" opacity=".8"/>${stripe}<circle cx="105" cy="47" r="3.5" fill="#13283a"/><circle cx="106" cy="46" r="1" fill="white"/><path d="M113 56q5 3 8 0" fill="none" stroke="#172c3c" stroke-width="1.5"/><text x="12" y="18" font-size="12" fill="#fff" opacity=".8">✦</text></svg>`}
function openPanel(title,content){const o=$('overlay');o.innerHTML=`<div class="panel"><div class="panelhead"><h2>${title}</h2><button class="red" onclick="closePanel()">Close</button></div>${content}</div>`;o.classList.add('open')}
function closePanel(){$('overlay').classList.remove('open');$('overlay').innerHTML=''}
function showMap(){openPanel('Explore fishing places',`<p class="muted">Travel to a new water and discover its local fish.</p><div class="grid">${LOCATIONS.map(l=>`<div class="card"><h3>${l.name}</h3><div class="muted">${l.continent} · usual ${l.temp}°C · ${l.weather.join(', ')}</div><button class="green" onclick="travel('${l.id}')">${S.loc===l.id?'Current place':'Travel here'}</button></div>`).join('')}</div>`)}
function travel(id){if(!LOCATIONS.some(x=>x.id===id))return;S.loc=id;weatherRoll();state='idle';save();closePanel();hud();notify(`Now fishing at ${loc().name}`)}
function showShop(type){const kind=type==='rods'?'rods':type==='reels'?'reels':'lures',rows=kind==='rods'?RODS:kind==='reels'?REELS:LURES,owned=kind==='rods'?S.ownedRods:kind==='reels'?S.ownedReels:S.ownedLures,current=kind==='rods'?S.rod:kind==='reels'?S.reel:S.lure;openPanel(kind==='rods'?'Rod shop':kind==='reels'?'Reel shop':'Lure shop',`<p class="muted">${kind==='lures'?'Lures boost your odds of attracting higher-rarity fish. This changes odds only; location and weather rules still apply.':'Better gear widens the green timing box and makes fish easier to catch.'}</p><div class="grid">${rows.map(x=>{const has=owned.includes(x.id);return `<div class="card"><h3>${x.name}</h3><div class="muted">${kind==='lures'?x.desc:`Timing help: +${x.help}`}<br>${has?'Owned':`Price: ${x.cost} coins`}</div><button class="${has?'blue':'green'}" ${!has&&S.coins<x.cost?'disabled':''} onclick="${has?`equip('${kind}','${x.id}')`:`buy('${kind}','${x.id}')`}">${has?(current===x.id?'Equipped':'Equip'):'Buy'}</button></div>`}).join('')}</div>`)}
function buy(type,id){const kind=type==='rods'?'rods':type==='reels'?'reels':'lures',rows=kind==='rods'?RODS:kind==='reels'?REELS:LURES,x=rows.find(a=>a.id===id),owned=kind==='rods'?S.ownedRods:kind==='reels'?S.ownedReels:S.ownedLures;if(!x||owned.includes(id)||S.coins<x.cost)return;S.coins-=x.cost;owned.push(id);if(kind==='rods')S.rod=id;else if(kind==='reels')S.reel=id;else S.lure=id;save();hud();showShop(kind);notify(`${x.name} bought and equipped!`)}
function equip(type,id){if(type==='rods'&&S.ownedRods.includes(id))S.rod=id;else if(type==='reels'&&S.ownedReels.includes(id))S.reel=id;else if(type==='lures'&&S.ownedLures.includes(id))S.lure=id;save();hud();showShop(type)}
function showBag(){const value=S.inventory.reduce((n,f)=>n+f.value,0);openPanel('Fish basket · sell your catch',`<p>${S.inventory.length} fish in your basket · total value <b>${value} coins</b></p><button class="gold" ${value===0?'disabled':''} onclick="sellAll()">Sell all fish for ${value} coins</button><div class="grid">${S.inventory.length?S.inventory.slice().reverse().map((f,i)=>`<div class="card">${fishSvg(f)}<h3 style="color:${RARITY[f.rarity]||'#fff'}">${f.name}</h3><div class="muted">${f.weight.toFixed(1)} kg · ${f.rarity} · ${f.value} coins<br>${LOCATIONS.find(l=>l.id===f.loc)?.name||f.loc} · ${f.date||'catch recorded'}</div><button class="green" onclick="sellOne(${S.inventory.length-1-i})">Sell for ${f.value} coins</button></div>`).join(''):'<p class="muted">Your basket is empty. Catch a fish to add it here.</p>'}</div>`)}
function sellOne(index){if(index<0||index>=S.inventory.length)return;const [f]=S.inventory.splice(index,1);S.coins+=f.value;save();hud();showBag();notify(`Sold ${f.name} for ${f.value} coins.`)}
function sellAll(){const value=S.inventory.reduce((n,f)=>n+f.value,0);S.coins+=value;S.inventory=[];save();hud();showBag();notify(`Sold your fish for ${value} coins.`)}
function showBook(){const entries=Object.entries(S.book).sort((a,b)=>a[0].localeCompare(b[0])),known=entries.length;openPanel('Lifetime fish book',`<p>Documented <b>${known} / ${FISH.length}</b> fish · all discoveries and personal best weights are saved in this browser.</p><div class="bar"><i style="width:${Math.min(100,known/FISH.length*100)}%"></i></div><div class="grid">${entries.length?entries.map(([name,record])=>{const f=record.fish||FISH.find(x=>x.name===name)||{name,design:'#9bb',rarity:'common',shape:'slim'};return `<div class="card">${fishSvg(f)}<h3 style="color:${RARITY[f.rarity]||'#fff'}">${name}<span class="book-count">×${record.count}</span></h3><div class="muted">${f.rarity} · Personal best <b>${record.bestWeight.toFixed(1)} kg</b><br>Best estimated sale value: ${record.bestValue||0} coins · ${LOCATIONS.find(l=>l.id===f.loc)?.name||f.loc}</div></div>`}).join(''):'<p class="muted">No discoveries yet. Catch fish to fill your book!</p>'}</div>`)}
function settings(){openPanel('Season and weather',`<p class="muted">Season and temperature affect which fish can bite. The world gets a 35-second rain shower every five minutes; the countdown is shown above.</p><label for="seasonSelect">Season</label><select id="seasonSelect" onchange="setSeason(this.value)"><option value="spring" ${S.season==='spring'?'selected':''}>Spring</option><option value="summer" ${S.season==='summer'?'selected':''}>Summer</option><option value="autumn" ${S.season==='autumn'?'selected':''}>Autumn</option><option value="winter" ${S.season==='winter'?'selected':''}>Winter</option><option value="auto" ${S.season==='auto'?'selected':''}>Auto (changes every 90 seconds)</option></select><p>Now: ${environment().season}, ${environment().temp.toFixed(0)}°C, ${weather}. Equipped lure: ${lure().name} (+${Math.round(lure().bonus*100)}% rarity odds).</p>`)}
function setSeason(value){if(SEASONS.includes(value)||value==='auto'){S.season=value;save();hud();settings()}}
$('nav').addEventListener('click',e=>{const p=e.target.closest('button')?.dataset.page;if(p==='map')showMap();if(p==='rods'||p==='reels'||p==='lures')showShop(p);if(p==='bag')showBag();if(p==='book')showBook();if(p==='settings')settings()});
$('fishBtn').addEventListener('pointerdown',e=>{e.preventDefault();press()});canvas.addEventListener('pointerdown',()=>{if(state==='fight'||state==='idle')press()});window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();press()}if(e.key==='Escape')closePanel()});
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(innerWidth*dpr);canvas.height=Math.floor(innerHeight*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function draw(){const w=innerWidth,h=innerHeight,waterY=h*.53,l=loc();let g=ctx.createLinearGradient(0,0,0,waterY);g.addColorStop(0,'#a6ddff');g.addColorStop(1,'#e4e6c6');ctx.fillStyle=g;ctx.fillRect(0,0,w,waterY);g=ctx.createLinearGradient(0,waterY,0,h);g.addColorStop(0,l.color);g.addColorStop(1,'#09253d');ctx.fillStyle=g;ctx.fillRect(0,waterY,w,h-waterY);ctx.fillStyle='#ffffff20';for(let i=0;i<9;i++){const y=waterY+18+i*24;ctx.fillRect((clock*36+i*97)%w,y,60,2)}if(weather==='rain'){ctx.strokeStyle='#d5f3ff88';ctx.lineWidth=1.5;for(let i=0;i<70;i++){const x=(i*83+clock*190)%w,y=(i*47+clock*300)%(h*.45);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y+13);ctx.stroke()}}
 // Dock and angler. The fish is intentionally never shown in the water.
 ctx.fillStyle='#704c2b';ctx.fillRect(25,waterY-8,170,13);ctx.fillRect(42,waterY+5,9,38);ctx.fillRect(160,waterY+5,9,38);ctx.strokeStyle='#e8c39a';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(90,waterY-8);ctx.lineTo(115,waterY-72);ctx.stroke();ctx.fillStyle='#ffd2aa';ctx.beginPath();ctx.arc(119,waterY-72,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#24466c';ctx.fillRect(106,waterY-62,25,22);
 if(['cast','wait','fight'].includes(state)){let bx=Math.min(w-50,300),by=waterY+45;if(state==='cast'){const p=Math.min(1,castT/.45);bx=100+(bx-100)*p;by=waterY-35+(by-(waterY-35))*p-Math.sin(p*Math.PI)*65}ctx.strokeStyle='#ffffffaa';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(115,waterY-72);ctx.lineTo(bx,by);ctx.stroke();ctx.fillStyle='#ff594f';ctx.beginPath();ctx.arc(bx,by,7,0,Math.PI*2);ctx.fill();if(state==='wait'){ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText('Waiting for a bite…',w/2,waterY+35)}}
 if(state==='fight'){const bw=Math.min(440,w-52),x=(w-bw)/2,y=h*.76,zone=Math.min(.52,.18+gear().rod.help*.045+gear().reel.help*.05);ctx.fillStyle='#07152de8';ctx.fillRect(x-14,y-45,bw+28,132);ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText(`${fish.name} · hit ${Math.min(hits+1,needed)} of ${needed}`,w/2,y-20);ctx.fillStyle='#29384d';ctx.fillRect(x,y,bw,28);ctx.fillStyle='#47c96b';ctx.fillRect(x+bw*.5-bw*zone/2,y,bw*zone,28);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+marker*bw,y-5);ctx.lineTo(x+marker*bw,y+33);ctx.stroke();ctx.fillStyle='#fff';ctx.font='13px system-ui';ctx.fillText('Press SPACE when the white line is inside the green box',w/2,y+55);ctx.fillStyle='#ff9a86';ctx.fillText(`Misses: ${misses}/5`,w/2,y+76)}}
let prev=performance.now(),lastHud=0;function loop(now){const dt=Math.min(.05,(now-prev)/1000);prev=now;clock+=dt;const wasRain=weather==='rain';weatherRoll();if((weather==='rain')!==wasRain)hud();if(now-lastHud>1000){hud();lastHud=now}if(state==='cast'){castT+=dt;if(castT>=.45){state='wait';biteAt=1+Math.random()*2;castT=0}}else if(state==='wait'){biteAt-=dt;if(biteAt<=0)bite()}if(state==='fight'){marker+=markerDir*dt*(.75+fish.difficulty*.14);if(marker>=.98){marker=.98;markerDir=-1}if(marker<=.02){marker=.02;markerDir=1}}draw();updateHint();requestAnimationFrame(loop)}
function updateHint(){const text={idle:'Press SPACE or tap FISH to cast',cast:'Casting…',wait:'Waiting for a bite… (1–3 seconds)',fight:'Press SPACE when the bouncing white line is inside the green box'};$('hint').textContent=text[state]}
weatherRoll();hud();requestAnimationFrame(loop);
</script>
</body>
</html>
