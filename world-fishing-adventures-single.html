<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Fishing Adventures</title>
  <style>
    :root {
      --bg: #071426;
      --panel: rgba(12, 23, 39, 0.88);
      --panel-2: rgba(20, 39, 64, 0.95);
      --line: rgba(110, 190, 255, 0.9);
      --gold: #f6c861;
      --green: #4fe07a;
      --red: #ff5f6d;
      --text: #edf6ff;
      --muted: #a4bfdc;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at top, #153d66 0%, var(--bg) 45%, #040c18 100%);
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
      background: linear-gradient(#0a1a2d, #081420);
    }

    #hud {
      position: fixed;
      top: 10px; left: 10px; right: 10px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: none;
      z-index: 10;
    }

    #stats, #nav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }

    .chip, .button, .card, .panel, .badge {
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    }

    .chip {
      background: rgba(11, 26, 52, 0.8);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
    }

    .button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(#2c86ff, #1a5abb);
      color: white;
      padding: 8px 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .button:hover { filter: brightness(1.12); }
    .button.primary { background: linear-gradient(#ffbd4a, #d98b00); color: #2d1d00; }
    .button.success { background: linear-gradient(#53d77a, #1d8247); }
    .button.danger { background: linear-gradient(#ff6868, #b52d2d); }
    .button.gold { background: linear-gradient(#ffd16c, #d79b00); color: #3c2600; }
    .button:disabled { opacity: 0.5; cursor: not-allowed; }

    #fishBtn {
      position: fixed;
      right: 16px;
      bottom: 18px;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      border: 0;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.1;
      background: radial-gradient(circle at 35% 30%, #ffca7a, #e9561a 55%, #b93d15 100%);
      color: white;
      box-shadow: 0 7px 0 #7e350d, 0 14px 32px rgba(0,0,0,0.32);
      cursor: pointer;
      z-index: 20;
    }
    #fishBtn:active, #fishBtn.on { transform: translateY(4px); box-shadow: 0 3px 0 #7e350d; }

    #hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 25, 46, 0.9);
      border: 1px solid rgba(255,255,255,0.12);
      color: white;
      border-radius: 999px;
      padding: 8px 16px;
      font-weight: 700;
      font-size: 14px;
      z-index: 12;
      max-width: 72vw;
      text-align: center;
    }

    #overlay, #modal {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 30;
    }

    #overlay.active, #modal.active {
      pointer-events: auto;
      background: rgba(3, 8, 18, 0.52);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .panel {
      width: min(1040px, 100%);
      max-height: 92vh;
      background: linear-gradient(180deg, var(--panel-2), rgba(8, 17, 30, 0.98));
      border-radius: 18px;
      border: 2px solid rgba(104, 167, 255, 0.55);
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02);
    }

    .panel-header h2 {
      margin: 0;
      font-size: 24px;
    }

    .panel-body {
      padding: 14px;
      overflow: auto;
      max-height: calc(92vh - 64px);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    .card {
      background: rgba(11, 24, 40, 0.9);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-height: 120px;
    }

    .card.locked {
      opacity: 0.56;
      filter: grayscale(0.2);
    }

    .card.selected {
      border-color: rgba(247, 197, 93, 0.9);
      box-shadow: 0 0 0 1px rgba(247,197,93,.35), 0 8px 28px rgba(247,197,93,.15);
    }

    .card h3, .card h4 { margin: 0; }
    .muted { color: var(--muted); font-size: 12px; }
    .tiny { font-size: 12px; }

    .bar {
      position: relative;
      height: 9px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar > i {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, #65c8ff, #4dffb5);
    }

    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,0.07);
      font-weight: 700;
      font-size: 12px;
    }

    .modal-box {
      width: min(500px, 100%);
      background: linear-gradient(180deg, #1a325c, #0d1c35);
      border-radius: 18px;
      border: 3px solid rgba(120, 180, 255, 0.7);
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
      padding: 18px;
      text-align: center;
    }

    .modal-box img {
      width: 220px;
      height: 110px;
      object-fit: contain;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 14px rgba(255,255,255,0.24));
    }

    .modal-box h2 { margin: 0 0 8px; }
    .tag {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      font-weight: 800;
      color: #0b162a;
      margin: 5px 0 8px;
    }

    .legend {
      animation: glow 1.3s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { box-shadow: 0 0 8px rgba(255,196,52,0.8), 0 0 18px rgba(255,196,52,0.5); }
      to { box-shadow: 0 0 18px rgba(255,196,52,0.85), 0 0 30px rgba(255,196,52,0.55); }
    }

    #toastBox {
      position: fixed;
      inset: 48px 0 auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      z-index: 40;
    }

    .toast {
      background: rgba(11, 26, 52, 0.9);
      border: 2px solid rgba(98, 177, 255, 0.9);
      color: white;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: 800;
      box-shadow: 0 10px 20px rgba(0,0,0,0.25);
      animation: pop 0.3s ease;
    }
    .toast.good { border-color: rgba(93, 255, 155, 0.9); }
    .toast.bad { border-color: rgba(255, 101, 112, 0.9); }
    @keyframes pop { from { opacity: 0; transform: translateY(-8px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

    @media (max-width: 760px) {
      #fishBtn { width: 100px; height: 100px; }
      .chip { font-size: 11px; padding: 6px 8px; }
    }
  </style>
</head>

    const clamp = (n, a, b) => Math.min(Math.max(n, a), b);
    const rnd = (a, b) => a + Math.random() * (b - a);
    const choose = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) h = (h ^ s.charCodeAt(i)) * 16777619 >>> 0; return h; };

    const RARITIES = {
      common: {color: '#b7bcc3', weight: 62, base: 10, difficulty: 1.5},
      uncommon: {color: '#53dc73', weight: 26, base: 22, difficulty: 2.2},
      rare: {color: '#5ca8ff', weight: 10, base: 72, difficulty: 3.2},
      epic: {color: '#b667ff', weight: 4.2, base: 200, difficulty: 4.4},
      legendary: {color: '#ffb54a', weight: 1.3, base: 460, difficulty: 5.4},
      mythical: {color: '#ff78cc', weight: 0.7, base: 900, difficulty: 6.4},
      secret: {color: '#ffe66d', weight: 0.3, base: 1800, difficulty: 7.0}
    };
    const RARITY_ORDER = Object.keys(RARITIES);

    const FISH_RAW = [];
    const addFish = (name, location, rarity, minKg, maxKg, options = {}) => {
      FISH_RAW.push({ name, location, rarity, minKg, maxKg, ...options });
    };

    function buildFish() {
      return FISH_RAW.map((raw) => {
        const id = `${raw.name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}_${raw.location}`;
        const avg = (raw.minKg + raw.maxKg) / 2;
        const baseValue = (raw.value ?? ((RARITIES[raw.rarity]?.base || 20) * (1 + Math.sqrt(avg) / 5)));
        const diff = raw.difficulty ?? Math.min(10, (RARITIES[raw.rarity]?.difficulty || 2) + (raw.maxKg > 30 ? 1.2 : 0));
        const speed = raw.speed ?? clamp(1.5 + avg * 0.55 + (hash(id) % 10) * 0.12, 1.5, 9.5);
        return {
          id,
          name: raw.name,
          location: raw.location,
          rarity: raw.rarity,
          minKg: raw.minKg,
          maxKg: raw.maxKg,
          value: Math.round(baseValue),
          difficulty: diff,
          speed,
          weather: raw.weather || null,
          season: raw.season || null,
          time: raw.time || null,
          temp: raw.temp || null,
          lure: raw.lure || null,
          deep: !!raw.deep,
          desc: raw.desc || 'A fish from this region.'
        };
      });
    }

        const light = 0.5 + 0.5 * Math.sin((S.clock - 0.22) * Math.PI * 2);
        const daytime = light > 0.52;
        const nighttime = light < 0.48;
        return {
          season,
          weather: this.state,
          temp: loc.temp,
          light,
          day: daytime,
          night: nighttime
        };
      },
      roll() {
        const loc = LOC[S.loc] || LOC.everglades;
        const weights = loc.weather || {clear: 5, cloudy: 3, rain: 2, snow: 0};
        const arr = ['clear', 'cloudy', 'rain', 'snow'];
        let t = Math.random() * Object.values(weights).reduce((a, b) => a + b, 0);
        for (let i = 0; i < arr.length; i++) {
          t -= weights[arr[i]] || 0;
          if (t <= 0) {
            this.state = arr[i];
            break;
          }
        }
        this.tick = 40 + Math.random() * 80;
      }

    function getSeason() {
      const month = new Date().getMonth();
      if ([11, 0, 1].includes(month)) return 'winter';
      if ([2, 3, 4].includes(month)) return 'spring';
      if ([5, 6, 7].includes(month)) return 'summer';
      return 'autumn';
    }

      const ratio = (weight - fish.minKg) / Math.max(0.1, fish.maxKg - fish.minKg);
      return Math.round(fish.value * (0.65 + 0.7 * clamp(ratio, 0, 1)));
    }

    function randomWeight(fish) {
      const p = Math.random();
      const range = fish.maxKg - fish.minKg;
      return +(fish.minKg + range * (p ** 1.6)).toFixed(2);
    }

      const loc = S.loc;
      const env = Weather.now();
      const season = env.season;
      const temp = loc.temp;

        if (fish.time && fish.time !== 'sunset') {
          const okDay = fish.time === 'day' ? env.day : fish.time === 'night' ? env.night : false;
          if (!okDay) return false;
        }
        if (fish.weather && fish.weather !== Weather.state) return false;
        if (fish.season && fish.season !== season) return false;
        if (fish.temp && (temp < fish.temp.min || temp > fish.temp.max)) return false;
        return true;
      });
    }

        if (fish.lure && fish.lure !== S.lure) w *= 0.45;
        if (fish.deep && lure.deep) w *= lure.deep;
        if (fish.deep && !lure.deep) w *= 0.5;
        if ((fish.minKg + fish.maxKg) / 2 >= 1 && (fish.minKg + fish.maxKg) / 2 <= 30) w *= lure.mid || 1;
        w *= 1 + rod.cast * 0.04;
        if (fish.weather === Weather.state) w *= 1.2;
        if (fish.season === env.season) w *= 1.2;
        total += w;
        return { fish, w };
      });
      let r = Math.random() * total;
      for (const item of scored) {
        r -= item.w;
        if (r <= 0) return item.fish;
      }
      return scored[0].fish;
    }

    const FishArt = {
      cache: {},
      url(fish, knocked = false) {
        const key = `${fish.id}:${knocked ? 'off' : 'on'}`;
        if (this.cache[key]) return this.cache[key];
        const c = document.createElement('canvas');
        c.width = 140; c.height = 72;
        const ctx = c.getContext('2d');
        const h = hash(fish.name + fish.location);
        const body = `hsl(${h % 360} 78% 60%)`;
        const belly = `hsl(${(h >> 4) % 360} 70% 80%)`;
        const fin = `hsl(${(h >> 2) % 360} 70% 45%)`;
        ctx.translate(70, 36);
        ctx.scale(1, 1);
        ctx.fillStyle = knocked ? 'rgba(255,255,255,0.2)' : body;
        ctx.beginPath();
        ctx.ellipse(0, 0, 46, 22, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = knocked ? 'rgba(255,255,255,0.08)' : belly;
        ctx.beginPath();
        ctx.ellipse(-8, 4, 24, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = knocked ? 'rgba(255,255,255,0.18)' : fin;
        ctx.beginPath();
        ctx.moveTo(14, -5); ctx.lineTo(34, -18); ctx.lineTo(34, 10); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(-50, -2, 10, 4);
        ctx.fillStyle = '#0b1b34';
        ctx.beginPath(); ctx.arc(22, -8, 3, 0, Math.PI * 2); ctx.fill();
        const data = c.toDataURL();
        this.cache[key] = data;
        return data;
      }
    };

    const Fishing = {
      state: 'idle',
      fish: null,
      weight: 0,
      biteTimer: 0,
      battleTime: 0,
      player: 0.5,
      cycle: 0,
      progress: 0,
      tension: 0,
      goal: 100,
      message: 'Press SPACE or tap FISH to cast.',
      reset() {
        this.state = 'idle';
        this.fish = null;
        this.weight = 0;
        this.biteTimer = 0;
        this.battleTime = 0;
        this.player = 0.5;
        this.cycle = 0;
        this.progress = 0;
        this.tension = 0;
        this.goal = 100;
      },
      cast() {
        const env = Weather.now();
        const fish = pickFish();
        this.fish = fish;
        this.weight = randomWeight(fish);
        this.state = 'waiting';
        this.biteTimer = rnd(1.0, 3.0);
        this.battleTime = 0;
        this.player = 0.5;
        this.progress = 0;
        this.tension = 0;
        this.goal = 70 + (fish.difficulty * 12); 
        this.message = 'Waiting for a bite...';
        Snd.sfx('cast');
      },
      triggerHook() {
        if (this.state !== 'bite') return;
        this.state = 'battle';
        this.player = 0.5;
        this.battleTime = 0;
        this.progress = 0;
        this.tension = 0;
        this.goal = 70 + (this.fish.difficulty * 12);
        this.message = 'SPACE when the line is in the green zone!';
        Snd.sfx('bite');
      },
      tryCatch() {
        if (this.state !== 'battle') return;
        const zone = 0.18 + (1.0 - clamp(this.fish.difficulty / 9, 0, 1)) * 0.08;
        const center = 0.5 + Math.sin(this.battleTime * (2.5 + this.fish.speed * 0.15)) * 0.38;
        const within = Math.abs(this.player - center) < zone * 0.65;
        const reel = reelValue();
        const rod = rodValue();
        if (within) {
          const gain = 18 + (rod.strength + reel.control) * 6 + (this.fish.rarity === 'secret' ? 12 : 0);
          this.progress += gain;
          this.tension = Math.max(0, this.tension - 14);
          if (this.progress >= this.goal) this.win();
        } else {
          this.tension += 18 + (9 - this.fish.difficulty) * 1.5;
          if (this.tension > 100) this.lose('The fish snapped the line!');
        }
        Snd.sfx(within ? 'ring' : 'bad');
      },
      lose(msg) {
        S.stats.lost += 1;
        UI.toast(msg, 'bad');
        Snd.sfx('lose');
        this.reset();
      },
      win() {
        const fish = this.fish;
        const weight = this.weight;
        const value = fishValue(fish, weight);
        S.stats.earned += value;
        const didNew = Inv.addCatch(fish, weight, value);
        Ach.onCatch(fish, weight, Weather.state);
        const rarityIndex = RARITY_ORDER.indexOf(fish.rarity);
        Snd.sfx(rarityIndex >= 4 ? 'legend' : 'catch');
        this.state = 'result';
        UI.catchCard(fish, weight, value, didNew);
      },
      update(dt) {
        S.clock = (S.clock + dt / 600) % 1;
        S.stats.time += dt;
        Weather.tick -= dt;
        if (Weather.tick <= 0) {
          Weather.roll();
          Weather.tick = 45 + Math.random() * 50;
        }

        if (this.state === 'waiting') {
          this.biteTimer -= dt;
          this.message = `Waiting for a bite... ${this.biteTimer.toFixed(1)}s`;
          if (this.biteTimer <= 0) {
            this.state = 'bite';
            this.message = 'BITE! Press SPACE now!';
            Snd.sfx('bite');
          }
        } else if (this.state === 'bite') {
          this.message = 'BITE! Press SPACE now!';
        } else if (this.state === 'battle') {
          this.battleTime += dt;
          const drift = 0.5 + Math.sin(this.battleTime * (2.5 + this.fish.speed * 0.2)) * 0.38;
          this.player = drift;
          this.message = 'Keep the line in the green window!';
          const tensionDecay = 4 * dt;
          this.tension = Math.max(0, this.tension - tensionDecay);
          if (this.progress >= this.goal) this.win();
        }
      },
      draw() {
        const c = cx;
        const W = cv.width;
        const H = cv.height;
        const loc = LOC[S.loc];
        const env = Weather.now();
        const skyGrad = c.createLinearGradient(0, 0, 0, H);
        skyGrad.addColorStop(0, loc.skyTop);
        skyGrad.addColorStop(1, loc.skyBottom);
        c.fillStyle = skyGrad;
        c.fillRect(0, 0, W, H);

        const sunX = W * ((S.clock + 0.2) % 1.0);
        const sunY = 80 + Math.sin((S.clock + 0.2) * Math.PI * 2) * 26;
        c.fillStyle = env.night ? 'rgba(20,30,65,0.6)' : 'rgba(255,255,255,0.2)';
        c.beginPath(); c.arc(sunX, sunY, 28, 0, Math.PI * 2); c.fill();

        c.fillStyle = loc.waterTop;
        c.fillRect(0, 250, W, H - 250);
        c.fillStyle = loc.waterBottom;
        c.fillRect(0, 290, W, H - 290);

        for (let i = 0; i < 22; i++) {
          const x = (i * 80 + S.clock * 180) % (W + 100) - 20;
          const y = 270 + ((i * 43) % 100);
          c.fillStyle = 'rgba(255,255,255,0.06)';
          c.fillRect(x, y, 70, 3);
        }

        const waterY = 278;
        if (this.state === 'waiting' || this.state === 'bite' || this.state === 'battle') {
          const fish = this.fish || FISH[0];
          c.globalAlpha = 0.8;
          const x = W * 0.72 + Math.sin(S.clock * 5 + fish.id.length) * 38;
          const y = waterY + Math.sin(S.clock * 7 + fish.name.length) * 10;
          const img = new Image();
          img.src = FishArt.url(fish);
          const size = 52 + this.weight * 0.1;
          c.drawImage(img, x - 40, y - 20, size, size * 0.5);
          c.globalAlpha = 1;
        }

        // dock and fisherman
        c.fillStyle = '#6f4b30';
        c.fillRect(0, 310, 160, 16);
        for (let x = 20; x < 150; x += 50) c.fillRect(x, 326, 10, 70);
        c.strokeStyle = '#e8c39a';
        c.lineWidth = 8;
        c.beginPath(); c.moveTo(110, 305); c.lineTo(110, 250); c.stroke();
        c.fillStyle = '#f4d0a5';
        c.beginPath(); c.arc(110, 235, 14, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#e04a48';
        c.fillRect(98, 245, 24, 20);

        const tipX = 160;
        const tipY = 208;
        const rodColor = `hsl(${(RodsIndex() || 0) * 38 + 25} 70% 60%)`;
        c.strokeStyle = rodColor;
        c.lineWidth = 4;
        c.beginPath();
        c.moveTo(112, 245);
        c.quadraticCurveTo(150, 185, tipX, tipY);
        c.stroke();

        if (this.state === 'waiting' || this.state === 'bite' || this.state === 'battle') {
          const linePos = this.state === 'battle' ? this.player : 0.5;
          const lineX = 160 + (tipX - 160) * 0.4 + linePos * 110;
          const lineY = 214 + (this.state === 'battle' ? 60 : 70);
          c.strokeStyle = '#eef5ff';
          c.lineWidth = 2;
          c.beginPath(); c.moveTo(tipX, tipY); c.lineTo(lineX, lineY); c.stroke();

          if (this.state === 'battle') {
            const zoneX = 183 + linePos * 210;
            const zoneW = 90;
            const zoneL = zoneX - zoneW / 2;
            const zoneR = zoneX + zoneW / 2;
            c.fillStyle = 'rgba(60, 255, 120, 0.3)';
            c.fillRect(zoneL, 140, zoneW, 28);
            c.strokeStyle = '#7bff9f';
            c.strokeRect(zoneL, 140, zoneW, 28);
            c.fillStyle = '#fff';
            c.fillRect(lineX - 4, lineY - 10, 8, 20);
            c.fillStyle = '#ff635c';
            c.fillRect(lineX - 4, lineY - 10, 8, 20);
          }
        }

        if (this.state === 'battle') {
          const barX = W * 0.5 - 170;
          const barY = 52;
          c.fillStyle = 'rgba(0,0,0,0.35)';
          c.fillRect(barX - 10, barY - 26, 360, 72);
          c.fillStyle = '#e9f7ff';
          c.font = 'bold 12px sans-serif';
          c.fillText('TENSION', barX, barY + 8);
          c.fillText('FIGHT', barX + 200, barY + 8);
          c.fillStyle = '#fff2';
          c.fillRect(barX, barY + 18, 340, 12);
          c.fillRect(barX + 200, barY + 18, 120, 12);
          c.fillStyle = this.tension > 70 ? '#ff5e5e' : '#ffcc4d';
          c.fillRect(barX, barY + 18, 340 * (this.tension / 100), 12);
          c.fillStyle = '#4ae0ff';
          c.fillRect(barX + 200, barY + 18, 120 * (this.progress / this.goal), 12);
        }
      }
    };

    const Inv = {

        S.stats.rar[fish.rarity] = (S.stats.rar[fish.rarity] || 0) + 1;
        S.coins += value;
        S.stats.earned += value;
        S.stats.heaviest = Math.max(S.stats.heaviest || 0, weight);

        node.textContent = text;
        $('toastBox').appendChild(node);
        setTimeout(() => node.remove(), 3200);
      },
      hud() {
        const loc = LOC[S.loc] || LOC.everglades;
        const env = Weather.now();
        $('stats').innerHTML = `
          <span class="chip">🪙 ${S.coins}</span>
          <span class="chip">📍 ${loc.name}</span>
          <span class="chip">${env.night ? '🌙' : '☀️'} ${env.weather}</span>
          <span class="chip">🌡 ${loc.temp}°C</span>
        `;
      },
      catchCard(fish, weight, value, isNew) {
        const c = RARITIES[fish.rarity].color;
        const big = RARITY_ORDER.indexOf(fish.rarity) >= 4;
        $('modal').classList.add('active');
        $('modal').innerHTML = `<div class="modal-box ${big ? 'legend' : ''}" style="border-color:${c};box-shadow:0 0 18px ${c};"><img src="${FishArt.url(fish)}"/><h2>${fish.name}</h2><div class="tag" style="background:${c}">${fish.rarity.toUpperCase()}${isNew ? ' · NEW' : ''}</div><div class="muted">Weight: ${weight.toFixed(2)}kg</div><div class="muted">Value: ${value} 🪙</div><button class="button success" onclick="UI.close(); Fishing.reset(); UI.hud();">Continue</button></div>`;
      }
    };

    const Snd = {
      ctx: null,
      musicTimer: null,
      init() {
        if (this.ctx) {
          if (this.ctx.state === 'suspended') this.ctx.resume();
          return;
        }
        try {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {}
      },
      tone(freq, duration, type = 'sine', volume = 0.06, when = 0) {
        if (!this.ctx || !S.settings.sfx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + when);
        gain.gain.setValueAtTime(0.0001, this.ctx.currentTime + when);
        gain.gain.exponentialRampToValueAtTime(volume, this.ctx.currentTime + when + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + when + duration);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(this.ctx.currentTime + when);
        osc.stop(this.ctx.currentTime + when + duration);
      },
      sfx(name) {
        if (!S.settings.sfx) return;
        const t = (f, d, type, v, at) => this.tone(f, d, type, v, at);
        const sounds = {
          cast: () => { t(440, 0.12, 'triangle', 0.05, 0); t(260, 0.18, 'sine', 0.04, 0.05); },
          bite: () => { t(850, 0.18, 'square', 0.06, 0); t(680, 0.16, 'square', 0.05, 0.04); },
          ring: () => { t(700, 0.12, 'triangle', 0.06, 0); },
          lose: () => { t(200, 0.3, 'sawtooth', 0.06, 0); },
          catch: () => { t(660, 0.1, 'triangle', 0.06, 0); t(800, 0.12, 'triangle', 0.06, 0.06); },
          legend: () => { t(880, 0.1, 'triangle', 0.08, 0); t(990, 0.13, 'triangle', 0.08, 0.08); t(1170, 0.18, 'triangle', 0.08, 0.16); },
          bad: () => { t(120, 0.12, 'sawtooth', 0.04, 0); }
        };
        (sounds[name] || sounds.cast)();
      }
    };

    function RodsIndex() {
      const arr = RODS.map((r) => r.id);
      return arr.indexOf(S.rod);
    }

    const Game = {
      init() {
        const canvas = $('game');
        cv = canvas;
        cx = cv.getContext('2d');
        if (!S.rods[S.rod]) S.rod = 'starter';
        if (!S.reels[S.reel]) S.reel = 'basic';
        if (!S.lures[S.lure]) S.lure = 'worm';
        if (!S.stats.cont) S.stats.cont = {};
        S.stats.cont[LOC[S.loc].continent] = 1;

        const resize = () => {
          const w = Math.max(600, Math.min(1200, window.innerWidth));
          cv.width = w;
          cv.height = 540;
        };
        window.addEventListener('resize', resize);
        resize();

        $('nav').innerHTML = [
          ['🗺️ Map', () => Game.map()],
          ['🎣 Rods', () => Shop.rods()],
          ['🌀 Reels', () => Shop.reels()],
          ['🪱 Lures', () => Shop.lures()],
          ['🎒 Bag', () => Inv.show()],
          ['📖 Book', () => Inv.book()],
          ['🏆 Tourney', () => Tournaments.open()],
          ['📊 Goals', () => Ach.statsWindow()],
          ['⚙️ Settings', () => Game.settings()],
          ['❔ Help', () => Game.help()]
        ].map(([label, fn], i) => `<button class="button" data-i="${i}" onclick="UI.nav(${i})">${label}</button>`).join('');

        UI.nav = (idx) => {
          if (Fishing.state === 'result' && $('modal').classList.contains('active')) return;
          if (Fishing.state !== 'idle') Fishing.reset();
          const actions = [
            () => Game.map(),
            () => Shop.rods(),
            () => Shop.reels(),
            () => Shop.lures(),
            () => Inv.show(),
            () => Inv.book(),
            () => Tournaments.open(),
            () => Ach.statsWindow(),
            () => Game.settings(),
            () => Game.help()
          ];
          actions[idx]?.();
        };

        document.addEventListener('keydown', (e) => {
          if (e.code === 'Space') {
            if ($('overlay').classList.contains('active')) return;
            e.preventDefault();
            if (!e.repeat) {
              if (Fishing.state === 'idle') Fishing.cast();
              else if (Fishing.state === 'waiting') Fishing.reset();
              else if (Fishing.state === 'bite') Fishing.triggerHook();
              else if (Fishing.state === 'battle') Fishing.tryCatch();
            }
          }
        });

        $('fishBtn').addEventListener('pointerdown', (e) => {
          e.preventDefault();
          $('fishBtn').classList.add('on');
          if ($('overlay').classList.contains('active')) return;
          if (Fishing.state === 'idle') Fishing.cast();
          else if (Fishing.state === 'waiting') Fishing.reset();
          else if (Fishing.state === 'bite') Fishing.triggerHook();
          else if (Fishing.state === 'battle') Fishing.tryCatch();
        });
        $('fishBtn').addEventListener('pointerup', () => $('fishBtn').classList.remove('on'));
        $('fishBtn').addEventListener('pointerleave', () => $('fishBtn').classList.remove('on'));

        Snd.init();
        Weather.roll();
        Ach.today();
        UI.hud();
        UI.open('World Fishing Adventures', `
          <div style="text-align:center;padding:20px 10px;">
            <h1 style="font-size:clamp(32px,7vw,56px);margin:0;color:#ffd76a;text-shadow:0 4px 0 #9f5a00;">World Fishing Adventures</h1>
            <p style="color:#dfeeff;max-width:560px;margin:12px auto 18px;">Travel the world, catch new species, buy better rods and reels, and compete in tournaments.</p>
            <button class="button primary" onclick="UI.close();">Start fishing</button>
          </div>
        `);

        let last = performance.now();
        const loop = (now) => {
          const dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          Fishing.update(dt);
          Rendering.draw();
          $('#hint').textContent = Fishing.message;
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      },
      map() {
        UI.open('World Map', `
          ${CONTS.map((cont) => `<div style="margin-bottom:12px"><h3>${cont}</h3><div class="grid">${LOCS.filter((l) => l.continent === cont).map((loc) => {
            const unlocked = S.unlocked.includes(loc.id);
            const selected = S.loc === loc.id;
            return `<div class="card ${selected ? 'selected' : ''} ${unlocked ? '' : 'locked'}" style="background:linear-gradient(135deg,${loc.waterTop}55,${loc.skyTop}88);">
              <h4>${loc.name}</h4>
              <div class="muted">${loc.sea ? 'Sea' : 'Freshwater'} · ${loc.temp}°C</div>
              <div class="muted">Need ${loc.req} catches</div>
              <button class="button ${unlocked ? 'success' : 'disabled'}" ${!unlocked ? 'disabled' : ''} onclick="Game.travel('${loc.id}')">${selected ? 'Current' : unlocked ? 'Travel' : 'Locked'}</button>
            </div>`;
          }).join('')}</div></div>`).join('')}
        `);
      },
      travel(id) {
        if (!S.unlocked.includes(id)) return;
        S.loc = id;
        S.stats.cont[LOC[id].continent] = 1;
        Weather.roll();
        Fishing.reset();
        UI.close();
        UI.hud();
        Save.save();
      },
      checkUnlocks() {
        for (const loc of LOCS) {
          if (S.total >= loc.req && !S.unlocked.includes(loc.id)) {
            S.unlocked.push(loc.id);
            UI.toast(`🌍 ${loc.name} unlocked`, 'good');
          }
        }
      },
      settings() {
        const s = S.settings;
        UI.open('Settings', `
          <div class="grid">
            <div class="card"><h3>Audio</h3><div class="muted">SFX</div><input type="checkbox" ${s.sfx ? 'checked' : ''} onchange="S.settings.sfx=this.checked;Save.save()"/><div class="muted">Music</div><input type="checkbox" ${s.music ? 'checked' : ''} onchange="S.settings.music=this.checked;Save.save()"/>
            <div class="muted">Volume</div><input type="range" min="0" max="1" step="0.05" value="${s.vol}" onchange="S.settings.vol=Number(this.value);Save.save()" /></div>
            <div class="card"><h3>Season</h3><select onchange="S.settings.season=this.value;Save.save();UI.hud();">${['auto','spring','summer','autumn','winter'].map((v) => `<option value="${v}" ${s.season === v ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
            <div class="card"><h3>Save</h3><button class="button primary" onclick="Save.download && Save.download()">Download save</button><textarea id="saveImport" rows="4" style="width:100%;margin-top:8px;border-radius:8px;padding:8px;background:#0d1a2c;color:white;border:1px solid #335;">Paste JSON here</textarea><button class="button success" onclick="Save.import(document.getElementById('saveImport').value);">Import</button></div>
            <div class="card"><h3>Danger zone</h3><button class="button danger" onclick="if(confirm('Erase all progress?')) Save.reset()">Erase save</button></div>
          </div>
        `);
      },
      help() {
        UI.open('How to play', `
          <div class="card"><h3>Controls</h3><p class="muted">1. Tap or press FISH to cast.</p><p class="muted">2. Wait 1–3 seconds for a bite.</p><p class="muted">3. Press SPACE when the line is in the green area.</p><p class="muted">4. Better rods and reels make the green zone easier to hit.</p><p class="muted">5. Fish habits depend on location, season, weather, and time of day.</p></div>
        `);
      }
    };

    const Rendering = {
      draw() {
        const c = cx;
        const W = cv.width;
        const H = cv.height;
        const env = Weather.now();
        const loc = LOC[S.loc] || LOC.everglades;
        c.clearRect(0, 0, W, H);

        const sky = c.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, loc.skyTop);
        sky.addColorStop(1, loc.skyBottom);
        c.fillStyle = sky;
        c.fillRect(0, 0, W, H);

        const sunX = (W * ((S.clock + 0.18) % 1)) || 80;
        const sunY = 100 + Math.sin(S.clock * Math.PI * 2) * 22;
        c.fillStyle = env.night ? 'rgba(13,26,52,0.6)' : 'rgba(255,255,255,0.18)';
        c.beginPath(); c.arc(sunX, sunY, 28, 0, Math.PI * 2); c.fill();

        // Water
        c.fillStyle = loc.waterTop;
        c.fillRect(0, 250, W, H - 250);
        c.fillStyle = loc.waterBottom;
        c.fillRect(0, 300, W, H - 300);

        // ripples/waves
        c.strokeStyle = 'rgba(255,255,255,0.10)';
        c.lineWidth = 2;
        for (let i = 0; i < 12; i++) {
          const offset = (i * 70 + S.clock * 180) % (W + 100) - 60;
          c.beginPath();
          c.moveTo(offset, 265 + i * 14);
          for (let x = 0; x < 18; x++) {
            const px = offset + x * 16;
            const py = 265 + i * 14 + Math.sin(x * 0.8 + S.clock * 10 + i) * 7;
            c.lineTo(px, py);
          }
          c.stroke();
        }

        // ambient fish
        const ambient = FISH.filter((f) => f.location === S.loc).slice(0, 9);
        ambient.forEach((fish, i) => {
          const x = ((i * 115 + S.clock * 120) % (W + 120)) - 50;
          const y = 260 + ((i % 4) * 25) + Math.sin(S.clock * 4 + i) * 6;
          const img = new Image();
          img.src = FishArt.url(fish);
          c.globalAlpha = 0.34;
          c.drawImage(img, x, y, 70, 28);
          c.globalAlpha = 1;
        });

        // dock and fisherman
        c.fillStyle = '#6d4424';
        c.fillRect(0, 315, 170, 14);
        for (let x = 25; x < 165; x += 52) c.fillRect(x, 328, 10, 72);
        c.strokeStyle = '#e8c39a';
        c.lineWidth = 8;
        c.beginPath(); c.moveTo(108, 307); c.lineTo(108, 244); c.stroke();
        c.fillStyle = '#f2cf9e';
        c.beginPath(); c.arc(108, 232, 14, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#d94747';
        c.fillRect(96, 244, 24, 18);

        const rodColor = `hsl(${(RodsIndex() || 0) * 38 + 26} 70% 58%)`;
        c.strokeStyle = rodColor;
        c.lineWidth = 4;
        c.beginPath(); c.moveTo(112, 244); c.quadraticCurveTo(150, 180, 160, 208); c.stroke();

        if (Fishing.state === 'waiting' || Fishing.state === 'bite' || Fishing.state === 'battle') {
          const center = 0.5 + Math.sin(Fishing.battleTime * (2.3 + Fishing.fish.speed * 0.18)) * 0.38;
          const x = 160 + center * 170;
          const y = 208 + (Fishing.state === 'battle' ? 80 : 65);
          c.strokeStyle = 'rgba(255,255,255,0.8)';
          c.lineWidth = 2;
          c.beginPath(); c.moveTo(160, 208); c.lineTo(x, y); c.stroke();
          c.fillStyle = '#f6fbff';
          c.fillRect(x - 4, y - 10, 8, 20);

          if (Fishing.state === 'battle') {
            const zoneX = 160 + center * 170;
            const zoneW = 86;
            const zoneL = zoneX - zoneW / 2;
            const zoneR = zoneX + zoneW / 2;
            c.fillStyle = 'rgba(87,255,153,0.2)';
            c.fillRect(zoneL, 130, zoneW, 26);
            c.strokeStyle = '#6bff98';
            c.strokeRect(zoneL, 130, zoneW, 26);
          }
        }

        if (Fishing.state === 'battle') {
          const boxX = W * 0.5 - 155;
          const boxY = 40;
          c.fillStyle = 'rgba(0,0,0,0.36)';
          c.fillRect(boxX - 10, boxY - 18, 340, 74);
          c.fillStyle = '#f4fbff';
          c.font = 'bold 12px sans-serif';
          c.fillText('TENSION', boxX, boxY + 6);
          c.fillText('FIGHT', boxX + 200, boxY + 6);
          c.fillStyle = '#f4f4f4';
          c.fillRect(boxX, boxY + 18, 340, 12);
          c.fillRect(boxX + 200, boxY + 18, 120, 12);
          c.fillStyle = Fishing.tension > 70 ? '#ff5a5a' : '#ffd166';
          c.fillRect(boxX, boxY + 18, 340 * (Fishing.tension / 100), 12);
          c.fillStyle = '#6ee7ff';
          c.fillRect(boxX + 200, boxY + 18, 120 * (Fishing.progress / Fishing.goal), 12);
        }
      }
    };

    function init() {
      Game.init();
      if (!S.unlocked.includes(S.loc)) S.unlocked.push(S.loc);
      Game.checkUnlocks();
      Save.save();
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
